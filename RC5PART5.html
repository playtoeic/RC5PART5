        }

        }

    bottom: 20px;

            background: rgba(0, 0, 0, 0.85);

            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;

    cursor: move;
    touch-action: none;
        }

        .tool-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 7px;
            font-weight: 200;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover { background: #333; }
        .tool-btn.active { background: #ff94a8; color: #000; border-color: #ff94a8; }

        .color-picker-group {
            display: flex;
            gap: 4px;
            align-items: center;
            border-left: 1px solid #444;
            border-right: 1px solid #444;
            padding: 0 6px;
        }

        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: transform 0.15s;
        }

        .color-dot.selected { border-color: #fff; transform: scale(1.2); }

        .size-select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 3px 6px;
            border-radius: 8px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }


        .quiz-container {
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;

	/* THÊM 3 DÒNG NÀY ĐỂ KÍCH HOẠT SCROLL SNAP */
    	height: 100vh;                   /* Bắt buộc có chiều cao bằng màn hình */
    	overflow-y: auto;                /* Cho phép cuộn bên trong danh sách */
    	scroll-snap-type: y mandatory;   /* Bắt buộc tự động nhảy đúng từng mục */
    	padding-bottom: 50vh;            /* Khoảng trống để cuộn thoải mái ở câu cuối */
	scroll-padding-top: 10px;
        }

        .quiz-header {
            text-align: center;
            background: #000000;
            color: #ffb7c5; /* Hồng đào sáng trên nền đen */

            letter-spacing: 0.5px;
        }

            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #ffd1dc;

	/* THÊM DÒNG NÀY: Giúp card tự nhảy vào đúng chính giữa màn hình khi cuộn */
    	scroll-snap-align: start;
    	flex-shrink: 0;                  /* Giữ nguyên kích thước card không bị co lại */
        }

        /* Tiêu đề & Nội dung câu hỏi */
        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 20px;
        }

        .question-number {
            background-color: #1877f2; /* Hồng đào đậm */
            color: #ffffff;
            font-weight: bold;
            border-radius: 50%;
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            line-height: 3;
            color: #1a1a1a;
            padding-top: 6px;
        }

        /* Lưới lựa chọn (2 cột) */

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background-color: #ffffff;
            border: 1.5px solid #ffccd5;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            text-align: left;
            font-size: 15px;
            color: #333333;
        }

        .option-btn:hover:not(.disabled) {
            background-color: #fff0f3;
            border-color: #ff94a8;
        }

        .option-label {
            background-color: #f0f0f0;
            color: #333333;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            font-size: 14px;
        }

        .option-text {
            flex-grow: 1;
            font-weight: 600;
        }

        .status-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #ffffff;
            margin-left: 8px;
            font-weight: bold;
        }

        /* Trạng thái ĐÚNG */
        .option-btn.correct {
            border-color: #2e7d32 !important;
            background-color: #ffffff !important;
        }

        .option-btn.correct .option-label {
            background-color: #4caf50;
            color: #fff;
        }

        .option-btn.correct .status-icon {
            background-color: #4caf50;
        }

        .option-btn.correct .status-icon::after {
            content: "✓";
        }

        /* Trạng thái SAI */
        .option-btn.incorrect {
            border-color: #d32f2f !important;
            background-color: #ffffff !important;
        }

        .option-btn.incorrect .option-label {
            background-color: #f44336;
            color: #fff;
        }

        .option-btn.incorrect .status-icon {
            background-color: #f44336;
        }

        .option-btn.incorrect .status-icon::after {
            content: "✕";
        }

        .option-btn.disabled {
            cursor: default;
        }

        /* Phần giải thích */
        .explanation-box {
            display: none;
            margin-top: 18px;
            animation: fadeIn 0.3s ease;
        }

        .short-note {
            font-size: 15px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 8px;
            padding-left: 4px;
        }

            border-left: 4px solid #ff94a8;
            border-radius: 6px;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.6;

        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    // LOGIC QUIZ
    function renderQuiz() {
        const container = document.getElementById('quiz-content');
        container.innerHTML = '';

        quizData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">${q.id}</div>
                    <div class="question-text">${q.question}</div>
                </div>
                
                <div class="options-grid">
                    ${q.options.map(opt => `
                        <button class="option-btn" onclick="checkAnswer(${index}, '${opt.id}')" data-id="${opt.id}">
                            <span class="option-label">${opt.id}</span>
                            <span class="option-text">${opt.text}</span>
                            <span class="status-icon-holder"></span>
                        </button>
                    `).join('')}
                </div>

                <div class="explanation-box">
                    <div class="short-note">💡 ${q.shortNote}</div>
                    <div class="translation-card"><b>Dịch nghĩa:</b> ${q.explanation}</div>
                </div>
            `;

            container.appendChild(card);
        });
    }

    function checkAnswer(questionIndex, selectedId) {
        const qData = quizData[questionIndex];
        const card = document.getElementsByClassName('question-card')[questionIndex];
        const buttons = card.querySelectorAll('.option-btn');
        const explainBox = card.querySelector('.explanation-box');

        buttons.forEach(btn => {
            btn.classList.add('disabled');
            btn.onclick = null;

            const btnId = btn.getAttribute('data-id');
            const iconHolder = btn.querySelector('.status-icon-holder');

            if (btnId === qData.correct) {
                btn.classList.add('correct');
                iconHolder.innerHTML = `<span class="status-icon"></span>`;
            }

            if (btnId === selectedId && selectedId !== qData.correct) {
                btn.classList.add('incorrect');
                iconHolder.innerHTML = `<span class="status-icon"></span>`;
            }
        });

        explainBox.style.display = 'block';
    }

    // LOGIC BÚT VẼ & UNDO
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    
    let isDrawingMode = false;
    let isPainting = false;
    let currentColor = '#ff334b';
    let currentLineWidth = 2;
    let isEraser = false;

    let strokes = [];
    let currentStroke = null;
    let holdTimer = null;         // Timer đếm thời gian giữ tay
    let isSnapStraight = false;   // Cờ đánh dấu đã chuyển thành đường thẳng

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    
    // Giữ nguyên kích thước hiển thị CSS
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    
    // Scale ngữ cảnh vẽ theo DPR để đường nét sắc nét
    ctx.scale(dpr, dpr);
    redrawCanvas();
}

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function toggleDrawingMode() {
        isDrawingMode = !isDrawingMode;
        const btn = document.getElementById('toggle-draw-btn');
        if (isDrawingMode) {
            canvas.classList.add('active');
            btn.classList.add('active');
            btn.innerHTML = '🛑 Tắt';
        } else {
            canvas.classList.remove('active');
            btn.classList.remove('active');
            btn.innerHTML = '✏️ Vẽ';
        }
    }

    function setColor(color, element) {
        isEraser = false;
        currentColor = color;
        document.getElementById('eraser-btn').classList.remove('active');
        
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
        if (element) element.classList.add('selected');
    }

    function setBrushSize(size) {
        currentLineWidth = parseInt(document.getElementById('brush-size').value, 10);
    }

    function setEraser() {
        isEraser = true;
        document.getElementById('eraser-btn').classList.add('active');
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
    }

    function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        strokes.forEach(stroke => {
            if (stroke.points.length < 1) return;

            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (stroke.isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = stroke.width * 4;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = stroke.color;
                ctx.lineWidth = stroke.width;
            }

            ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
            for (let i = 1; i < stroke.points.length; i++) {
                ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
            }
            ctx.stroke();
        });

        ctx.globalCompositeOperation = 'source-over';
    }

    function undoLastStroke() {
        strokes.pop();
        redrawCanvas();
    }

    function clearCanvas() {
        strokes = [];
        redrawCanvas();
    }

    function getPos(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

function startPosition(e) {
    if (!isDrawingMode) return;
    isPainting = true;
    isSnapStraight = false;

    const pos = getPos(e);
    currentStroke = {
        color: currentColor,
        width: currentLineWidth,
        isEraser: isEraser,
        points: [pos],
        rawPoints: [pos] // Lưu lại đường nét gốc ban đầu
    };
    strokes.push(currentStroke);
    
    // Bắt đầu đếm thời gian giữ yên
    resetHoldTimer();
    draw(e);
}

function finishedPosition() {
    if (!isPainting) return;
    isPainting = false;
    clearTimeout(holdTimer); // Hủy đếm giờ khi buông tay
    ctx.beginPath();
}

function draw(e) {
    if (!isPainting || !isDrawingMode) return;
    e.preventDefault();

    const pos = getPos(e);

    // Nếu đã chuyển sang đường thẳng, chỉ cập nhật điểm cuối
    if (isSnapStraight) {
        currentStroke.points = [currentStroke.rawPoints[0], pos];
        redrawCanvas();
        return;
    }

    // Luôn ghi lại điểm vẽ nguệch ngoạc
    currentStroke.rawPoints.push(pos);
    currentStroke.points.push(pos);
    redrawCanvas();

    // Đặt lại timer mỗi khi có di chuyển
    resetHoldTimer();
}

// Hàm xử lý việc đếm thời gian để giữ và duỗi thẳng đường kẻ
function resetHoldTimer() {
    clearTimeout(holdTimer);
    if (!isPainting || isEraser) return; // Không áp dụng khi dùng tẩy

    holdTimer = setTimeout(() => {
        if (isPainting && currentStroke && currentStroke.points.length > 2) {
            isSnapStraight = true;
            const startPoint = currentStroke.rawPoints[0];
            const lastPoint = currentStroke.rawPoints[currentStroke.rawPoints.length - 1];
            
            // Biến đường vẽ thành 1 đoạn thẳng nối từ điểm đầu đến điểm cuối
            currentStroke.points = [startPoint, lastPoint];
            redrawCanvas();
        }
    }, 350); // 350ms (khoảng 0.35 giây) giữ yên để biến thành đường thẳng
}

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mouseleave', finishedPosition);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', startPosition, { passive: false });
    canvas.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('touchmove', draw, { passive: false });

    renderQuiz();

// ========================================================
// LOGIC KÉO LÊ THANH CÔNG CỤ CỌ VẼ
// ========================================================
const toolbar = document.querySelector('.draw-toolbar');
let isDraggingToolbar = false;
let startX, startY, initialLeft, initialTop;

function onDragStart(e) {
    // Không kích hoạt kéo lê nếu người dùng bấm vào nút bấm, ô chọn hoặc chấm màu
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.classList.contains('color-dot')) {
        return;
    }

    isDraggingToolbar = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    startX = clientX;
    startY = clientY;

    // Lấy vị trí hiện tại của thanh công cụ
    const rect = toolbar.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    // Chuyển vị trí về top/left để tính toán tọa độ chính xác
    toolbar.style.bottom = 'auto';
    toolbar.style.left = `${initialLeft}px`;
    toolbar.style.top = `${initialTop}px`;
}

function onDragMove(e) {
    if (!isDraggingToolbar) return;
    e.preventDefault();

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const dx = clientX - startX;
    const dy = clientY - startY;

    toolbar.style.left = `${initialLeft + dx}px`;
    toolbar.style.top = `${initialTop + dy}px`;
}

function onDragEnd() {
    isDraggingToolbar = false;
}

// Bắt sự kiện trên Máy tính (Mouse)
toolbar.addEventListener('mousedown', onDragStart);
window.addEventListener('mousemove', onDragMove);
window.addEventListener('mouseup', onDragEnd);

// Bắt sự kiện trên Điện thoại / Máy tính bảng (Touch)
toolbar.addEventListener('touchstart', onDragStart, { passive: false });
window.addEventListener('touchmove', onDragMove, { passive: false });
window.addEventListener('touchend', onDragEnd);
</script>
